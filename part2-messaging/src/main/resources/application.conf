dadbot {
  # Overridden per node by `Node.config(n)`.
  node = "node-0"
  webhook.port = 8080
}

pekko {
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  loglevel = INFO

  actor {
    provider = cluster
    # Dad.NewMessage crosses the network now, so it needs a serializer.
    serialization-bindings {
      "dadbot.part2.CborSerializable" = jackson-cbor
    }
  }

  remote.artery.canonical {
    hostname = "127.0.0.1"
    port = 25520
  }

  cluster {
    # The scripted Program runs three nodes in one JVM.
    jmx.multi-mbeans-in-same-jvm = on

    # Any node joins through the first seed that answers. node-0 must be started first to form the cluster.
    seed-nodes = ["pekko://DadBot@127.0.0.1:25520", "pekko://DadBot@127.0.0.1:25521"]

    # keep-majority, stable-after = 20s (defaults): an unreachable node is downed after 20s without changes,
    # and only then are its shards allocated elsewhere.
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"

    sharding {
      passivation.default-idle-strategy.idle-entity.timeout = 30s

      # 0 (the default) silently selects the legacy rebalance algorithm, which moves one shard per round
      # (rebalance-threshold = 1). Any limit > 0 selects the newer one: up to min(20, 10% of shards) per
      # rebalance-interval (10s). reference.conf recommends it.
      least-shard-allocation-strategy.rebalance-absolute-limit = 20
    }
  }

  management.http {
    hostname = "127.0.0.1"
    port = 8550
    # Allows PUT /cluster/members/{address} (operation=Leave) for the demo. There's no authentication, so don't
    # do this on a real network.
    route-providers-read-only = false
  }
}
