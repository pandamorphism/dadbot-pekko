# Loaded with `ConfigFactory.load("part3")` (Node.baseConfig), not as application.conf: the root project puts
# every part on one classpath, and only one application.conf would win.

dadbot {
  # Overridden per node by `Node.config(n)`.
  node = "node-0"
  webhook.port = 8080
}

pekko {
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  loglevel = INFO

  actor {
    provider = cluster
    # Messages, events and Dad's state are serialized now: to the network and to the journal.
    serialization-bindings {
      "dadbot.part3.CborSerializable" = jackson-cbor
    }
  }

  remote.artery.canonical {
    hostname = "127.0.0.1"
    port = 25520
  }

  cluster {
    # The scripted Program runs three nodes in one JVM.
    jmx.multi-mbeans-in-same-jvm = on

    # Any node joins through the first seed that answers. node-0 must be started first to form the cluster.
    seed-nodes = ["pekko://DadBot@127.0.0.1:25520", "pekko://DadBot@127.0.0.1:25521"]

    # keep-majority, stable-after = 20s (defaults): an unreachable node is downed after 20s without changes,
    # and only then are its shards allocated elsewhere.
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"

    sharding {
      # When a node crashes, the shards it hosted start on another node right away, together with every Dad that
      # was running in them, so a Dad with unread messages tells his joke without waiting for the next message.
      # The eventsourced store keeps the list in the journal (Postgres). The default, ddata, would need
      # durable ddata on the node's own disk, which a crashed node takes with it.
      remember-entities = on
      remember-entities-store = eventsourced

      # See part 2: selects the newer least-shard rebalance algorithm.
      least-shard-allocation-strategy.rebalance-absolute-limit = 20
    }
  }

  persistence {
    journal.plugin = "pekko.persistence.r2dbc.journal"
    # Sharding's remember-entities store takes snapshots. Dad doesn't.
    snapshot-store.plugin = "pekko.persistence.r2dbc.snapshot"

    # docker-compose.yml
    r2dbc.connection-factory {
      host = "localhost"
      port = 5432
      database = "dadbot"
      user = "dadbot"
      password = "dadbot"
    }
  }

  management {
    http {
      hostname = "127.0.0.1"
      port = 8550
      # Allows PUT /cluster/members/{address} (operation=Leave) for the demo. There's no authentication, so don't
      # do this on a real network.
      route-providers-read-only = false
    }

    # GET /ready is 200 only when the node is an Up cluster member (management-cluster-http's own check) and
    # Postgres answers. GET /alive is 200 as long as the node runs.
    health-checks {
      readiness-checks.database = "dadbot.part3.DatabaseCheck"
      # The first connection to Postgres takes longer than the 1 s default.
      check-timeout = 3s
    }
  }
}
