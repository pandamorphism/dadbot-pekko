pekko {
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  loglevel = INFO

  actor.provider = cluster

  remote.artery.canonical {
    hostname = "127.0.0.1"
    port = 25520
  }

  cluster {
    # A one-node cluster: the node joins itself. Part 2 adds more nodes.
    seed-nodes = ["pekko://DadBot@127.0.0.1:25520"]
    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"

    # Virtual actors: a Dad starts on his first message and is passivated after being idle
    # (Pekko's default is 120s).
    sharding.passivation.default-idle-strategy.idle-entity.timeout = 30s
  }
}
